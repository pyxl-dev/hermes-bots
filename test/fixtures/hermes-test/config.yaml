# Modèle du ~/.hermes-test (gateway de test, voir docs/adr/0001). `test-gateway.ts reset` le copie, puis y ajoute
# dashboard.basic_auth (mot de passe généré, jamais dans le dépôt). Aucune plateforme (ni Telegram, ni API, ni A2A) :
# seul le webapp écoute, sur 127.0.0.1:9320 (la prod : 9120).
model:
  default: hy4-flash-free
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
  api_mode: chat_completions
agent:
  max_turns: 40
  reasoning_effort: low
  reasoning_overrides:
    hy4-flash-free: low
terminal:
  backend: local
  cwd: '~'
  timeout: 180
plugins:
  enabled:
    - model-guard
    - bot-groups
  disabled: []
webapp:
  enabled: true
  host: 127.0.0.1
  port: 9320
  public_url: http://hermes-test.localhost:9320 # un nom non bouclé engage la connexion par mot de passe, comme la prod ; *.localhost se résout en local
telemetry:
  shared_metrics:
    enabled: false
